{% extends "base.html" %}

{% block breadcrumb %}System Exception{% endblock %}

{% block content %}
<section class="hero-banner" style="text-align: center; padding: 60px 24px;">
  <div class="hero-tag" style="background: rgba(244, 63, 94, 0.15); border-color: rgba(244, 63, 94, 0.3); color: var(--accent-rose);">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <span>HTTP Status {{ status_code }}</span>
  </div>
  <h1 class="hero-title" style="font-size: 2.8rem; margin: 12px 0;">Error <span class="gradient-text">{{ status_code }}</span></h1>
  <p class="hero-subtitle" style="margin: 0 auto 24px; max-width: 500px;">
    {{ message }}
  </p>
  <div style="display: flex; justify-content: center; gap: 12px;">
    <a href="/" class="btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Return to Dashboard</span>
    </a>
  </div>
</section>
{% endblock %}
